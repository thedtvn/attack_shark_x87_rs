[package]
name = "ask87_py"
description = "Python bindings for the ATTACK SHARK X87 keyboard"
# Distributed as a Python wheel (maturin), not on crates.io.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The extension module `ask87._native`.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
attack_shark_x87 = { workspace = true }
hidapi = "2.6"
# abi3: one wheel works for every CPython >= 3.9.
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[features]
extension-module = ["pyo3/extension-module"]
